services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy -d energy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - energy_db:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://energy:energy@db:5432/energy
      SECRET_KEY: ${SECRET_KEY:-change-this-key-use-at-least-32-characters}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@smartenergy.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo123!}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  energy_db:
